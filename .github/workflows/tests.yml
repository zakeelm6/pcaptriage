name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Virtual display for the desktop-window test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk
      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s tests -v
