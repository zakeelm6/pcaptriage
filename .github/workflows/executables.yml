name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (optional, e.g. v0.3.0)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: pcaptriage-linux-x86_64
            built: pcaptriage
            gui_asset: pcaptriage-gui-linux-x86_64
            gui_built: pcaptriage-gui
            gui_flags: ""
          - os: windows-latest
            asset: pcaptriage-windows-x86_64.exe
            built: pcaptriage.exe
            gui_asset: pcaptriage-gui-windows-x86_64.exe
            gui_built: pcaptriage-gui.exe
            gui_flags: "--windowed"
          - os: macos-latest
            asset: pcaptriage-macos-arm64
            built: pcaptriage
            gui_asset: pcaptriage-gui-macos-arm64
            gui_built: pcaptriage-gui
            gui_flags: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # attach the binary to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip "pyinstaller>=6"
          pyinstaller --onefile --name pcaptriage --paths . packaging/entry.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.built }} --version
          ./dist/${{ matrix.built }} serve --help

      - name: Name the asset
        shell: bash
        run: cp "dist/${{ matrix.built }}" "${{ matrix.asset }}"

      - name: Build the desktop application
        shell: bash
        run: |
          # --windowed hides the console window on Windows. On the other systems it would
          # change the packaging (a .app bundle on macOS), so it is left off there.
          pyinstaller --onefile --name pcaptriage-gui ${{ matrix.gui_flags }} --paths . packaging/gui_entry.py
          test -f "dist/${{ matrix.gui_built }}"
          cp "dist/${{ matrix.gui_built }}" "${{ matrix.gui_asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.gui_asset }}

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" "${{ matrix.gui_asset }}" --clobber
