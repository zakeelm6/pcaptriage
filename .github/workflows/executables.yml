name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (optional, e.g. v0.3.0)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: pcaptriage-linux-x86_64
            built: pcaptriage
          - os: windows-latest
            asset: pcaptriage-windows-x86_64.exe
            built: pcaptriage.exe
          - os: macos-latest
            asset: pcaptriage-macos-arm64
            built: pcaptriage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # attach the binary to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip "pyinstaller>=6"
          pyinstaller --onefile --name pcaptriage --paths . packaging/entry.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.built }} --version
          ./dist/${{ matrix.built }} serve --help

      - name: Name the asset
        shell: bash
        run: cp "dist/${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
